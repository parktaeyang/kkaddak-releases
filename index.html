  function setLang(lang) {
    if (!STRINGS[lang]) lang = "ko";
    var dict = STRINGS[lang];

    document.querySelectorAll("[data-i18n]").forEach(function (el) {
      var key = el.getAttribute("data-i18n");
      if (dict[key] !== undefined) el.innerHTML = dict[key];
    });
    document.querySelectorAll("[data-i18n-attr]").forEach(function (el) {
      var key = el.getAttribute("data-i18n-attr");
      if (dict[key] !== undefined) el.setAttribute("alt", dict[key]);
    });

    document.title = dict.title;
    var descMeta = document.querySelector('meta[name="description"]');
    if (descMeta) descMeta.setAttribute("content", dict.description);
    document.documentElement.setAttribute("lang", lang);

    document.getElementById("lang-btn-ko").classList.toggle("active", lang === "ko");
    document.getElementById("lang-btn-en").classList.toggle("active", lang === "en");

    try { localStorage.setItem("kkaddak-lang", lang); } catch (e) {}
  }

  function initialLang() {
    try {
      var stored = localStorage.getItem("kkaddak-lang");
      if (stored) return stored;
    } catch (e) {}
    return navigator.language && navigator.language.toLowerCase().indexOf("ko") === 0 ? "ko" : "en";
  }

  setLang(initialLang());

  // 다운로드 버튼을 최신 GitHub Release의 .dmg로 연결하고 버전·크기를 표시한다.
  // 실패하면 기본 링크(릴리스 페이지)가 그대로 남는다.
  (function () {
    var owner = "parktaeyang";
    var repo = "kkaddak-releases";
    fetch("https://api.github.com/repos/" + owner + "/" + repo + "/releases/latest")
      .then(function (r) { return r.json(); })
      .then(function (data) {
        var assets = data.assets || [];
        var tag = data.tag_name || "";
        var macAsset = assets.find(function (a) { return /\.dmg$/i.test(a.name); });
        if (macAsset) {
          var link = document.getElementById("download-link-mac");
          link.href = macAsset.browser_download_url;
          link.setAttribute("download", "");
          document.getElementById("download-meta-mac").textContent =
            tag + " · Apple Silicon · " + (macAsset.size / (1024 * 1024)).toFixed(1) + " MB";
        }
      })
      .catch(function () {});
  })();
